<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>냥이 Bot — 상태 & 기능 요청</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav">
  <span class="brand">🐾 냥이 Bot</span>
  <div class="nav-tabs">
    <button class="tab active" data-tab="status">상태</button>
    <button class="tab" data-tab="requests">기능 요청</button>
  </div>
  <div class="nav-right">
    <span id="owner-badge" class="owner-badge hidden">오너</span>
    <button id="btn-owner" class="ghost-btn">오너 로그인</button>
    <button id="btn-refresh" class="ghost-btn" title="새로고침">↺</button>
  </div>
</nav>

<!-- ───── 상태 탭 ───── -->
<section id="tab-status" class="tab-panel">
  <div class="container">
    <div id="status-banner" class="banner banner-loading">
      <div class="banner-dot"></div>
      <div class="banner-body">
        <div id="banner-title" class="banner-title">상태 확인 중…</div>
        <div id="banner-meta" class="banner-meta">—</div>
      </div>
      <div class="banner-uptime">
        <div id="overall-uptime" class="uptime-val">—</div>
        <div class="uptime-label">가동률</div>
      </div>
    </div>

    <div id="status-chips" class="status-chips"></div>

    <h2 class="section-title">서비스 현황</h2>
    <div id="svc-grid" class="svc-grid">
      <div class="muted">로딩 중…</div>
    </div>

    <h2 class="section-title">장애 요약 <span class="muted small">(최근 30시간, 1칸=1시간)</span></h2>
    <div id="incident-list" class="incident-list">
      <div class="muted">로딩 중…</div>
    </div>
  </div>
</section>

<!-- ───── 기능 요청 탭 ───── -->
<section id="tab-requests" class="tab-panel hidden">
  <div class="container">
    <div class="card form-card">
      <h2 class="section-title">기능 요청 추가</h2>
      <input id="req-title" class="input" maxlength="200" placeholder="제목 (예: .채팅 이전 기록 표시)">
      <div class="form-row">
        <select id="req-category" class="input"></select>
        <select id="req-severity" class="input"></select>
      </div>
      <textarea id="req-detail" class="input" rows="3" maxlength="2000" placeholder="상세 설명 (선택)"></textarea>
      <button id="btn-submit" class="primary-btn">요청 등록</button>
      <div id="submit-msg" class="form-msg"></div>
    </div>

    <div class="req-toolbar">
      <h2 class="section-title">요청 목록</h2>
      <div class="filters">
        <button class="chip active" data-filter="all">전체</button>
        <button class="chip" data-filter="검토대기">검토대기</button>
        <button class="chip" data-filter="진행중">진행중</button>
        <button class="chip" data-filter="해결">해결</button>
        <button class="chip" data-filter="보류">보류</button>
        <button class="chip" data-filter="미해결">미해결</button>
      </div>
    </div>
    <div id="req-list" class="req-list"><div class="muted">로딩 중…</div></div>
  </div>
</section>

<!-- ───── 오너 로그인 모달 ───── -->
<div id="login-modal" class="modal hidden">
  <div class="modal-box">
    <h3>오너 로그인</h3>
    <p class="muted small">승인·상태 변경은 오너만 가능합니다.</p>
    <input id="login-pw" type="password" class="input" placeholder="비밀번호">
    <div class="modal-actions">
      <button id="login-cancel" class="ghost-btn">취소</button>
      <button id="login-ok" class="primary-btn">로그인</button>
    </div>
    <div id="login-msg" class="form-msg"></div>
  </div>
</div>

<footer class="footer">
  <button id="btn-server" class="link-btn">API 서버 주소 설정</button>
  <span id="api-base-label" class="muted small"></span>
</footer>

<script src="js/app.js"></script>
</body>
</html>
