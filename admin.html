<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 — Bot Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Login overlay ── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(13,17,23,.96);
      display: flex; align-items: center; justify-content: center;
    }
    /* ── Shell terminal ── */
    .shell-output {
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      color: #3fb950;
      min-height: 120px;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 10px;
    }
    .shell-prompt { color: var(--muted); }
    /* ── Visit chart ── */
    .chart-wrap { position: relative; height: 160px; }
    canvas#visit-chart { width: 100%; height: 160px; }
    .chart-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .chart-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    .legend-total::before  { background: var(--blue); }
    .legend-unique::before { background: var(--green); }
  </style>
</head>
<body>

<!-- ── 로그인 오버레이 ─────────────────────────────────────────────────────── -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-title">관리자 로그인</div>
    <div id="login-err" class="alert alert-error" style="display:none;margin-bottom:12px"></div>
    <div class="form-group">
      <label>GitHub 토큰 (gist+repo write)</label>
      <input id="li-token"  type="password" placeholder="ghp_...">
    </div>
    <div class="form-group">
      <label>RCS 시크릿 (config.json › github.rcs_secret)</label>
      <input id="li-secret" type="password" placeholder="랜덤 문자열">
    </div>
    <div class="form-group">
      <label>Owner / 대시보드 레포</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input id="li-owner" type="text" placeholder="wnsdn517">
        <input id="li-repo"  type="text" placeholder="bot-dashboard">
      </div>
    </div>
    <button id="btn-login" class="btn btn-primary" style="width:100%">로그인</button>
    <p class="text-muted mt-8" style="font-size:11px;text-align:center">
      정보는 이 브라우저의 localStorage에만 저장됩니다.
    </p>
  </div>
</div>

<!-- ── 메인 콘텐츠 ────────────────────────────────────────────────────────── -->
<div id="admin-content" style="display:none">
<nav class="nav">
  <span class="nav-brand">냥이 Bot</span>
  <a href="index.html" class="nav-link">상태</a>
  <a href="admin.html" class="nav-link active">관리</a>
  <div class="nav-right">
    <button id="btn-logout" class="btn btn-sm">로그아웃</button>
  </div>
</nav>

<div class="container">
  <div id="toast" class="alert" style="display:none"></div>

  <!-- 접속 통계 그래프 -->
  <div class="card mb-16">
    <div class="card-title">대시보드 접속 통계 (최근 30일)</div>
    <div class="chart-wrap">
      <canvas id="visit-chart"></canvas>
    </div>
    <div class="chart-legend">
      <span class="legend-total">전체 접속</span>
      <span class="legend-unique">고유 방문자</span>
    </div>
    <p id="visit-summary" class="text-muted mt-8" style="font-size:11px"></p>
  </div>

  <!-- 봇 제어 -->
  <div class="card mb-16">
    <div class="card-title">원격 제어 (RCS)</div>
    <div class="flex" style="flex-wrap:wrap;gap:10px">
      <button id="btn-restart" class="btn btn-danger">봇 재시작</button>
      <button id="btn-au-on"   class="btn">자동업데이트 ON</button>
      <button id="btn-au-off"  class="btn">자동업데이트 OFF</button>
    </div>
    <p class="text-muted mt-8" style="font-size:11px">
      명령은 HMAC-SHA256 서명 후 GitHub 경유 → 봇이 30초 내 실행·결과 기록
    </p>
  </div>

  <!-- 공지 -->
  <div class="card mb-16">
    <div class="card-title">전체 공지</div>
    <div class="form-group">
      <label>메시지</label>
      <textarea id="announce-msg" rows="3" placeholder="공지 내용..."></textarea>
    </div>
    <button id="btn-announce" class="btn btn-primary">전송</button>
  </div>

  <!-- 셸 실행 -->
  <div class="card mb-16">
    <div class="card-title">셸 명령 실행</div>
    <div class="flex">
      <input id="shell-cmd" type="text" placeholder="ls -la / systemctl status ..." style="flex:1;font-family:monospace">
      <button id="btn-shell" class="btn btn-primary">실행</button>
    </div>
    <div id="shell-output" class="shell-output" style="display:none"></div>
  </div>

  <div class="grid-2">
    <!-- 방 관리 -->
    <div class="card">
      <div class="card-title">방 관리</div>
      <div class="flex mb-8">
        <input id="room-id-input" type="text" placeholder="방 ID (숫자)" style="flex:1">
        <button id="btn-room-add"    class="btn btn-primary btn-sm">추가</button>
        <button id="btn-room-remove" class="btn btn-danger  btn-sm">제거</button>
      </div>
    </div>
    <!-- 매니저 관리 -->
    <div class="card">
      <div class="card-title">매니저 관리</div>
      <div class="flex mb-8">
        <input id="mgr-id-input" type="text" placeholder="User ID (숫자)" style="flex:1">
        <button id="btn-mgr-add"    class="btn btn-primary btn-sm">추가</button>
        <button id="btn-mgr-remove" class="btn btn-danger  btn-sm">제거</button>
      </div>
    </div>
  </div>

  <!-- 명령 결과 -->
  <div class="card mt-16">
    <div class="card-title">최근 명령 결과</div>
    <div id="cmd-results" class="text-muted">명령을 전송하면 여기에 결과가 표시됩니다.</div>
  </div>
</div>
</div><!-- /admin-content -->

<script type="module">
import {
  getSettings, saveSettings, isConfigured,
  rcsAnnounce, rcsRestart, rcsSetUpdate,
  rcsRoomAdd, rcsRoomRemove, rcsManagerAdd, rcsManagerRemove,
  rcsShell, waitForResult, recordVisit, getVisits,
} from "./js/api.js?v=20260623g";

// ── 로그인 ──────────────────────────────────────────────────────────────────
function checkLogin() {
  const s = getSettings();
  if (s.rcsSecret && s.ghToken) {
    document.getElementById("login-overlay").style.display = "none";
    document.getElementById("admin-content").style.display = "";
    return true;
  }
  // 저장된 값 미리 채우기
  document.getElementById("li-token").value  = s.ghToken;
  document.getElementById("li-secret").value = s.rcsSecret;
  document.getElementById("li-owner").value  = s.owner;
  document.getElementById("li-repo").value   = s.repo;
  return false;
}

document.getElementById("btn-login").addEventListener("click", () => {
  const token  = document.getElementById("li-token").value.trim();
  const secret = document.getElementById("li-secret").value.trim();
  const owner  = document.getElementById("li-owner").value.trim();
  const repo   = document.getElementById("li-repo").value.trim();
  const err    = document.getElementById("login-err");
  if (!token || !secret) {
    err.textContent = "토큰과 RCS 시크릿을 입력하세요.";
    err.style.display = "";
    return;
  }
  saveSettings({ ghToken: token, rcsSecret: secret, owner, repo });
  err.style.display = "none";
  checkLogin();
  init();
});

document.getElementById("btn-logout").addEventListener("click", () => {
  ["gh_token","rcs_secret","gh_owner","gh_repo","gh_branch"].forEach(k => localStorage.removeItem(k));
  location.reload();
});

// ── Toast / Result 헬퍼 ─────────────────────────────────────────────────────
function toast(msg, type = "info") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `alert alert-${type}`;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 5000);
}

function addResult(action, result, status = "info") {
  const el = document.getElementById("cmd-results");
  if (el.textContent.includes("표시됩니다")) el.innerHTML = "";
  const row = document.createElement("div");
  row.className = `alert alert-${status}`;
  row.style.marginBottom = "6px";
  row.textContent = `[${new Date().toLocaleTimeString()}] ${action}: ${result || "대기 중…"}`;
  el.prepend(row);
}

async function send(label, fn) {
  if (!isConfigured()) { toast("설정을 먼저 저장하세요.", "error"); return; }
  toast(`${label} 전송 중…`);
  try {
    const cmdId  = await fn();
    addResult(label, "전송 완료, 봇 응답 대기 중…", "info");
    const result = await waitForResult(cmdId);
    addResult(label, result ?? "응답 없음 (타임아웃)", result ? "success" : "error");
    toast(result ? `${label}: ${result}` : "응답 없음", result ? "success" : "error");
  } catch (e) {
    addResult(label, `오류: ${e.message}`, "error");
    toast(`오류: ${e.message}`, "error");
  }
}

// ── 접속 그래프 ─────────────────────────────────────────────────────────────
async function renderVisitChart() {
  await recordVisit();
  const data = await getVisits();
  const canvas = document.getElementById("visit-chart");
  const ctx    = canvas.getContext("2d");
  const days   = (data?.days || []).slice(-30);

  const W = canvas.offsetWidth || 600;
  const H = 160;
  canvas.width  = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);

  const PAD_L = 32, PAD_R = 8, PAD_T = 12, PAD_B = 28;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;

  const maxVal = Math.max(1, ...days.map(d => d.total || 0));
  const barW   = Math.max(4, (chartW / Math.max(days.length, 1)) - 2);

  ctx.clearRect(0, 0, W, H);

  // Y grid lines
  ctx.strokeStyle = "#30363d";
  ctx.lineWidth   = 1;
  for (let i = 0; i <= 4; i++) {
    const y = PAD_T + (chartH / 4) * i;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    ctx.fillStyle = "#8b949e";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(Math.round(maxVal * (1 - i / 4)), PAD_L - 4, y + 4);
  }

  days.forEach((d, i) => {
    const x       = PAD_L + i * (chartW / Math.max(days.length, 1));
    const totalH  = ((d.total  || 0) / maxVal) * chartH;
    const uniqueH = ((d.unique || 0) / maxVal) * chartH;

    // total bar (blue, behind)
    ctx.fillStyle = "rgba(88,166,255,.5)";
    ctx.fillRect(x + 1, PAD_T + chartH - totalH, barW, totalH);

    // unique bar (green, in front)
    ctx.fillStyle = "rgba(63,185,80,.8)";
    ctx.fillRect(x + 1, PAD_T + chartH - uniqueH, barW * 0.6, uniqueH);

    // X label (every 5 days)
    if (i % 5 === 0 || i === days.length - 1) {
      ctx.fillStyle = "#8b949e";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(d.date.slice(5), x + barW / 2, H - 6);
    }
  });

  // Summary
  const todayEntry = days.find(d => d.date === new Date().toISOString().slice(0,10));
  const totalSum   = days.reduce((s, d) => s + (d.total  || 0), 0);
  const uniqueSum  = days.reduce((s, d) => s + (d.unique || 0), 0);
  document.getElementById("visit-summary").textContent =
    `오늘: 접속 ${todayEntry?.total ?? 0}회 / 고유 ${todayEntry?.unique ?? 0}명 · ` +
    `30일 합계: 접속 ${totalSum}회 / 고유 ${uniqueSum}명`;
}

// ── 버튼 이벤트 ─────────────────────────────────────────────────────────────
document.getElementById("btn-restart").addEventListener("click", () => {
  if (!confirm("봇을 재시작하시겠습니까?")) return;
  send("재시작", rcsRestart);
});
document.getElementById("btn-au-on").addEventListener("click",  () => send("자동업데이트 ON",  () => rcsSetUpdate(true)));
document.getElementById("btn-au-off").addEventListener("click", () => send("자동업데이트 OFF", () => rcsSetUpdate(false)));

document.getElementById("btn-announce").addEventListener("click", () => {
  const msg = document.getElementById("announce-msg").value.trim();
  if (!msg) { toast("메시지를 입력하세요.", "error"); return; }
  send("공지", () => rcsAnnounce(msg));
});

// 셸
document.getElementById("btn-shell").addEventListener("click", async () => {
  const cmd = document.getElementById("shell-cmd").value.trim();
  if (!cmd) { toast("명령을 입력하세요.", "error"); return; }
  if (!isConfigured()) { toast("설정을 먼저 저장하세요.", "error"); return; }

  const out = document.getElementById("shell-output");
  out.style.display = "";
  out.textContent   = `$ ${cmd}\n실행 중…`;

  toast("셸 명령 전송 중…");
  try {
    const cmdId  = await rcsShell(cmd);
    const result = await waitForResult(cmdId, 45000);
    out.textContent = `$ ${cmd}\n${result ?? "(응답 없음)"}`;
    toast(result ? "실행 완료" : "응답 없음 (타임아웃)", result ? "success" : "error");
  } catch (e) {
    out.textContent = `$ ${cmd}\nerror: ${e.message}`;
    toast(`오류: ${e.message}`, "error");
  }
});

document.getElementById("shell-cmd").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btn-shell").click();
});

document.getElementById("btn-room-add").addEventListener("click", () => {
  const rid = parseInt(document.getElementById("room-id-input").value.trim());
  if (!rid) { toast("방 ID를 입력하세요.", "error"); return; }
  send(`방 ${rid} 추가`, () => rcsRoomAdd(rid));
});
document.getElementById("btn-room-remove").addEventListener("click", () => {
  const rid = parseInt(document.getElementById("room-id-input").value.trim());
  if (!rid) { toast("방 ID를 입력하세요.", "error"); return; }
  send(`방 ${rid} 제거`, () => rcsRoomRemove(rid));
});
document.getElementById("btn-mgr-add").addEventListener("click", () => {
  const uid = parseInt(document.getElementById("mgr-id-input").value.trim());
  if (!uid) { toast("User ID를 입력하세요.", "error"); return; }
  send(`매니저 ${uid} 추가`, () => rcsManagerAdd(uid));
});
document.getElementById("btn-mgr-remove").addEventListener("click", () => {
  const uid = parseInt(document.getElementById("mgr-id-input").value.trim());
  if (!uid) { toast("User ID를 입력하세요.", "error"); return; }
  send(`매니저 ${uid} 제거`, () => rcsManagerRemove(uid));
});

// ── 초기화 ──────────────────────────────────────────────────────────────────
async function init() {
  renderVisitChart();
}

if (checkLogin()) init();
</script>
</body>
</html>
